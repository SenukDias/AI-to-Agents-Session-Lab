<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">
  <defs>
    <style>
      @keyframes flow {
        0%   { transform: translateX(-100px); opacity: 0; }
        5%   { opacity: 1; }
        92%  { opacity: 1; }
        100% { transform: translateX(1500px); opacity: 0; }
      }
      .dot { animation: flow 4s linear infinite; }
      .dot1 { animation-delay: 0s;    }
      .dot2 { animation-delay: 1.3s;  }
      .dot3 { animation-delay: 2.6s;  }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="320" fill="#0E1013"/>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" fill="#FACC15" font-size="14" font-weight="bold" font-family="monospace">
    PROMPT → ANSWER PIPELINE
  </text>

  <!-- Stage 1: Prompt -->
  <rect x="20"   y="60" width="190" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="115"  y="110" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold" font-family="monospace">Prompt</text>
  <text x="115"  y="130" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">User Input</text>
  <text x="115"  y="160" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">📝</text>

  <!-- Arrow 1 -->
  <text x="222"  y="130" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">▶</text>

  <!-- Stage 2: BPE Tokenizer -->
  <rect x="240"  y="60" width="190" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="335"  y="105" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="monospace">BPE Tokenizer</text>
  <text x="335"  y="125" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">→ Token IDs</text>
  <text x="335"  y="155" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">🔤</text>

  <!-- Arrow 2 -->
  <text x="442"  y="130" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">▶</text>

  <!-- Stage 3: Embedding Vectors -->
  <rect x="460"  y="60" width="190" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="555"  y="100" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="monospace">Embedding</text>
  <text x="555"  y="118" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="monospace">Vectors</text>
  <text x="555"  y="138" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">→ 1536-dim</text>
  <text x="555"  y="162" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">📐</text>

  <!-- Arrow 3 -->
  <text x="662"  y="130" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">▶</text>

  <!-- Stage 4: Prefill + KV Cache -->
  <rect x="680"  y="60" width="190" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="775"  y="100" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="monospace">Prefill +</text>
  <text x="775"  y="118" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="monospace">KV Cache</text>
  <text x="775"  y="138" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">matrix multiply</text>
  <text x="775"  y="162" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">⚡</text>

  <!-- Arrow 4 -->
  <text x="882"  y="130" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">▶</text>

  <!-- Stage 5: Autoregressive Decode -->
  <rect x="900"  y="60" width="190" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="995"  y="98" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="monospace">Autoregressive</text>
  <text x="995"  y="115" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="monospace">Decode</text>
  <text x="995"  y="135" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">bandwidth-bound</text>
  <text x="995"  y="162" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">🔁</text>

  <!-- Arrow 5 -->
  <text x="1102" y="130" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">▶</text>

  <!-- Stage 6: Sampling Knobs -->
  <rect x="1120" y="60" width="260" height="130" rx="8" fill="#181A1F" stroke="#FACC15" stroke-width="1.5"/>
  <text x="1250" y="100" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="monospace">Sampling Knobs</text>
  <text x="1250" y="120" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="monospace">temp / top-k / top-p</text>
  <text x="1250" y="162" text-anchor="middle" fill="#FACC15" font-size="22" font-family="monospace">🎛️</text>

  <!-- Data flow track line -->
  <line x1="20" y1="230" x2="1380" y2="230" stroke="#FACC15" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Animated dots (traveling along y=230 track) -->
  <g transform="translate(0, 225)">
    <circle class="dot dot1" cy="5" cx="0" r="6" fill="#FACC15" opacity="0"/>
    <circle class="dot dot2" cy="5" cx="0" r="6" fill="#FACC15" opacity="0"/>
    <circle class="dot dot3" cy="5" cx="0" r="6" fill="#FACC15" opacity="0"/>
  </g>

  <!-- Stage labels at bottom -->
  <text x="115"  y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">01</text>
  <text x="335"  y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">02</text>
  <text x="555"  y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">03</text>
  <text x="775"  y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">04</text>
  <text x="995"  y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">05</text>
  <text x="1250" y="265" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">06</text>

  <!-- Footer -->
  <text x="700" y="300" text-anchor="middle" fill="#9CA3AF" font-size="10" font-family="monospace">
    AI to Agents Session Lab · Senuk Manditha Dias
  </text>
</svg>
