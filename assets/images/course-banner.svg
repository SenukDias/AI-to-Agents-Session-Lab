<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1013" />
      <stop offset="100%" stop-color="#14171D" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A1F" />
      <stop offset="100%" stop-color="#1C1F26" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FEDA03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />

  <!-- Grid pattern dots -->
  <g opacity="0.12">
    <circle cx="50" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="100" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="150" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="200" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="1000" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="1050" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="1100" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="1150" cy="50" r="1.5" fill="#FACC15" />
    <circle cx="50" cy="270" r="1.5" fill="#FACC15" />
    <circle cx="100" cy="270" r="1.5" fill="#FACC15" />
    <circle cx="1100" cy="270" r="1.5" fill="#FACC15" />
    <circle cx="1150" cy="270" r="1.5" fill="#FACC15" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="160" r="220" fill="#FACC15" opacity="0.04" filter="url(#glow)" />

  <!-- Outer Bento Border Frame -->
  <rect x="24" y="24" width="1152" height="272" rx="16" fill="none" stroke="#262930" stroke-width="1.5" />
  <rect x="24" y="24" width="1152" height="272" rx="16" fill="none" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="160 800" opacity="0.6" />

  <!-- Top Pill -->
  <rect x="440" y="44" width="320" height="32" rx="16" fill="#181A1F" stroke="#FACC15" stroke-width="1" />
  <circle cx="458" cy="60" r="4" fill="#22C55E" />
  <text x="472" y="65" fill="#FACC15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HANDS-ON PRODUCTION LAB</text>

  <!-- Main Title -->
  <text x="600" y="132" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">AI TO AGENTS SESSION LAB</text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" fill="#FACC15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">From LLM Internals &amp; Local CPU Ollama to Autonomous Agentic Task Scheduling</text>

  <!-- Description line -->
  <text x="600" y="202" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Zero GPU Required • 4GB-8GB CPU Friendly • Pure Python ReAct Tool Calling • Real-World HITL Scheduling</text>

  <!-- Bottom Pills Row -->
  <g transform="translate(600, 248)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#181A1F" stroke="#262930" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600">6 Modular Labs</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-150, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#181A1F" stroke="#262930" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#FACC15" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600">qwen2.5:1.5b CPU</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(40, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#181A1F" stroke="#262930" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600">ReAct &amp; HITL Gates</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(240, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="6" fill="#181A1F" stroke="#FACC15" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#FACC15" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600">Senuk Manditha Dias</text>
    </g>
  </g>
</svg>
